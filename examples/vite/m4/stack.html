<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Natural-JS M4 · stacked employees</title>
    <link rel="stylesheet" href="/m4/stack.css">
  </head>
  <body>
    <header class="site-header">
      <h1>Employees · stacked</h1>
      <button type="button" data-action="open">Open another screen</button>
      <a href="/m4/side.html">Side-by-side layout</a>
    </header>
    <main data-hosts></main>
    <template data-screen>
      <section class="employee-page" data-page="employees" aria-label="Employee screen">
        <header class="page-header">
          <h2>Employee editor</h2>
          <button type="button" data-action="close">Close screen</button>
        </header>
        <div class="search-tools">
          <form data-role="search" class="search-bar">
            <label>Search name or email <input data-field="query" autocomplete="off"></label>
            <button type="submit">Search</button>
          </form>
          <label>Visible filter <input data-role="filter" autocomplete="off"></label>
        </div>
        <section class="detail-panel" aria-label="Employee details">
          <h3>Details</h3>
          <output data-role="selected" aria-live="polite">No employee selected</output>
          <form data-role="detail" novalidate>
            <div class="fields">
              <div><label>Name <input data-field="name" required></label><small data-error-for="name"></small></div>
              <div><label>Email <input data-field="email" type="email" required data-validate='[["email"],["companyEmail"]]'></label><small data-error-for="email"></small></div>
              <div><label>Salary <input data-field="salary" inputmode="decimal" required data-format='[["commas"]]' data-validate='[["integer"],["minvalue",0]]'></label><small data-error-for="salary"></small></div>
              <div><label>Team <input data-field="profile.team" required></label><small data-error-for="profile.team"></small></div>
              <div><label>Department <input data-field="profile.department"></label><small data-error-for="profile.department"></small></div>
            </div>
          </form>
          <button type="button" data-action="save">Save changes</button>
        </section>
        <section class="list-panel" aria-label="Employee list">
          <div class="actions">
            <button type="button" data-action="add">Add employee</button>
            <button type="button" data-action="delete">Delete selected</button>
            <button type="button" data-action="revert">Revert changes</button>
          </div>
          <div class="view-tools">
            <label>Rows per page <select data-role="page-size"><option value="">Choose a size</option></select></label>
            <nav data-role="pager" aria-label="Employee pages">
              <button type="button" data-page-prev>Previous</button>
              <button type="button" data-page-template><span data-page-number></span></button>
              <button type="button" data-page-next>Next</button>
              <output data-page-status></output>
            </nav>
          </div>
          <table data-role="grid">
            <caption>Employees</caption>
            <thead>
              <tr>
                <th scope="col" aria-sort="none"><button type="button" data-action="sort-name">Name</button></th>
                <th scope="col">Email</th>
                <th scope="col">Team</th>
                <th scope="col">Choice</th>
              </tr>
            </thead>
            <tbody>
              <tr data-row-template>
                <th scope="row"><button type="button" data-select-row>Open <span data-field="id"></span>: <span data-field="name"></span></button></th>
                <td data-field="email"></td>
                <td data-field="profile.team"></td>
                <td><label>Choice
                  <select data-field="chosen" data-options="a" data-option-label="aa" data-option-value="bb">
                    <option value="">Choose</option>
                  </select>
                </label></td>
              </tr>
            </tbody>
          </table>
          <section class="compact-panel" aria-label="Employee compact list">
            <h3>Compact list</h3>
            <ul data-role="list">
              <li data-row-template>
                <button type="button" data-select-row><span data-field="name"></span></button>
                <span data-field="profile.team"></span>
                <label>Choice <select data-field="chosen" data-options="a"
                  data-option-label="aa" data-option-value="bb"><option value="">Choose</option></select></label>
              </li>
              <li data-empty hidden>No visible employees</li>
            </ul>
          </section>
        </section>
        <footer class="page-footer">
          <output data-role="status" aria-live="polite"></output>
          <output data-role="error" role="alert"></output>
        </footer>
      </section>
    </template>
    <script type="module" src="/m4/main.ts"></script>
  </body>
</html>
