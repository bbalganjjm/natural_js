<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural-JS v2.0 Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>Natural-JS v2.0.0 통합 테스트</h1>
    
    <div id="results"></div>
    
    <div class="test-section">
        <h2>Test Components</h2>
        <div id="test-form">
            <input type="text" id="name" value="John">
            <input type="text" id="age" value="25">
        </div>
        <table id="test-grid">
            <thead>
                <tr><th>Name</th><th>Age</th></tr>
            </thead>
            <tbody>
                <tr><td id="name"></td><td id="age"></td></tr>
            </tbody>
        </table>
    </div>
    
    <script src="lib/jquery-3.7.1.min.js"></script>
    <script src="dist/natural.min.js"></script>
    <script>
        const results = document.getElementById('results');
        
        function test(name, fn) {
            try {
                const result = fn();
                const div = document.createElement('div');
                div.className = 'test-section success';
                div.innerHTML = `<h3>✓ ${name}</h3><pre>${result || 'OK'}</pre>`;
                results.appendChild(div);
                console.log(`✓ ${name}`);
                return true;
            } catch (e) {
                const div = document.createElement('div');
                div.className = 'test-section error';
                div.innerHTML = `<h3>✗ ${name}</h3><pre>${e.message}</pre>`;
                results.appendChild(div);
                console.error(`✗ ${name}:`, e);
                return false;
            }
        }
        
        // Run tests
        console.log('=== Natural-JS v2.0 Integration Test ===\n');
        
        test('1. N function exists', () => {
            if (typeof N !== 'function') throw new Error('N is not a function');
            return `typeof N: ${typeof N}`;
        });
        
        test('2. N.version', () => {
            if (!N.version) throw new Error('N.version not found');
            return `N.version: ${N.version}`;
        });
        
        test('3. Core - N.string.trimToEmpty', () => {
            const result = N.string.trimToEmpty('  test  ');
            if (result !== 'test') throw new Error(`Expected "test", got "${result}"`);
            return `N.string.trimToEmpty('  test  ') = "${result}"`;
        });
        
        test('4. Core - N.type', () => {
            if (!N.type) throw new Error('N.type not found');
            const result = N.type([]);
            return `N.type([]) = "${result}"`;
        });
        
        test('5. Architecture - N.comm', () => {
            if (typeof N.comm !== 'function') throw new Error('N.comm not found');
            return `typeof N.comm: ${typeof N.comm}`;
        });
        
        test('6. Data - N.formatter', () => {
            if (typeof N.formatter !== 'function') throw new Error('N.formatter not found');
            return `typeof N.formatter: ${typeof N.formatter}`;
        });
        
        test('7. UI - N("#test-form").form', () => {
            if (typeof N("#test-form").form !== 'function') throw new Error('form method not found');
            return `typeof N("#test-form").form: ${typeof N("#test-form").form}`;
        });
        
        test('8. UI - Form initialize', () => {
            const form = N([{name: "John", age: "25"}]).form({
                context: N("#test-form")
            });
            if (!form) throw new Error('Form creation failed');
            return `Form created: ${typeof form}`;
        });
        
        test('9. UI - N.grid', () => {
            if (typeof N.grid !== 'function') throw new Error('N.grid not found');
            return `typeof N.grid: ${typeof N.grid}`;
        });
        
        test('10. jQuery chainability', () => {
            const result = N("#test-form");
            if (!result.jquery) throw new Error('Not a jQuery object');
            return `N("#test-form").jquery: ${result.jquery}`;
        });
        
        console.log('\n=== All Tests Completed ===');
    </script>
</body>
</html>
