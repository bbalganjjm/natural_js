<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Tab Demo</title>
    <link rel="stylesheet" href="../../css/natural.ui.css" />
    <link rel="stylesheet" href="./common.css" />
    <script type="importmap">
      {
        "imports": {
          "@natural-js/shared": "../../packages/shared/dist/index.js",
          "@natural-js/core": "../../packages/core/dist/index.js",
          "@natural-js/architecture": "../../packages/architecture/dist/index.js",
          "@natural-js/data": "../../packages/data/dist/index.js",
          "@natural-js/ui": "../../packages/ui/dist/index.js",
          "@natural-js/ui-shell": "../../packages/ui-shell/dist/index.js",
          "@natural-js/template": "../../packages/template/dist/index.js",
          "@natural-js/code": "../../packages/code/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="page">
      <nav>
        <h1>UI Tab</h1>
        <ul><li><a href="./index.html">← 돌아가기</a></li></ul>
      </nav>
      <main>
        <div class="banner">
          <p class="tag">data-opts active/disable/preload · onActive/onOpen</p>
          <p>탭 전환, 비활성, onActive 이벤트를 확인합니다.</p>
        </div>

        <div class="card">
          <h2>Tabs</h2>
          <div id="tab-demo" class="tab__">
            <ul>
              <li data-opts='{"active": true}'>Home</li>
              <li>About</li>
              <li data-opts='{"disable": true}'>Disabled</li>
            </ul>
            <div>
              <section>Home Content</section>
              <section>About Content</section>
              <section>Disabled Content</section>
            </div>
          </div>
          <div class="toolbar">
            <button class="btn" id="btn-tab-activate-1">activate(1)</button>
            <button class="btn" id="btn-tab-enable">enable(2)</button>
            <button class="btn" id="btn-tab-disable">disable(1)</button>
          </div>
        </div>

        <div class="console" id="console"></div>
      </main>
    </div>

    <script type="module">
      import * as N from '../../packages/natural/dist/index.js';
      import { log } from './common.js';

      const tab = new N.Tab('#tab-demo', {
        onActive: (idx) => log('onActive', idx),
        onOpen: (idx) => log('onOpen', idx),
      });

      document.getElementById('btn-tab-activate-1').addEventListener('click', () => {
        tab.active(1);
      });
      document.getElementById('btn-tab-enable').addEventListener('click', () => {
        tab.enable(2);
        log('tab enable index 2');
      });
      document.getElementById('btn-tab-disable').addEventListener('click', () => {
        tab.disable(1);
        log('tab disable index 1');
      });
    </script>
  </body>
  </html>
